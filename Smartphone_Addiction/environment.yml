name: s6e8
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=2.2
  - numpy>=1.26
  - scikit-learn>=1.5
  - scipy>=1.13
  - lightgbm>=4.5
  - py-xgboost>=2.1
  - catboost>=1.2.5
  - matplotlib>=3.8
  - optuna>=3.6
  - jupyter
  - nbformat>=5.10
  - pip
  - pip:
      # Install the CUDA build explicitly; conda-forge pytorch may resolve to CPU-only.
      # For CPU-only, replace the index URL with .../whl/cpu
      - --index-url https://download.pytorch.org/whl/cu128
      - torch>=2.4
      - --index-url https://pypi.org/simple
      # optional, only for src/exp_realmlp.py
      # - pytabkit>=1.2
